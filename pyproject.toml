[project]
name = "habitalens"
version = "0.0.1"
description = "HabitaLens - motor OSS de analisis reproducible de inmuebles a partir de fuentes publicas."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "HabitaLens" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "pyarrow>=15.0",
    "fpdf2>=2.7",
    "pypdf>=4.0",
]

[project.scripts]
habitalens = "habitalens.cli:app"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habitalens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=2.3.1",
]
