# Mapa territorial de G0-A. Documenta la decision de routing (docs/decisions.md).
# No es una invariancia de geometria: la decision fiable viene del geocoder y,
# como corroboracion, del patron del refcat.
provider_territories:
  dgc:
    territory: dgc
    level: national
    province_codes: null
    refcat_patterns:
      - '^\d{7}[A-Z0-9]{2}\d{4}[A-Z0-9]$'  # 14 caracteres DGC
  navarra:
    territory: navarra
    level: region
    province_codes: ["31"]
    refcat_patterns:
      - '^\d{9}$'
  bizkaia:
    territory: bizkaia
    level: province
    province_codes: ["48"]
    refcat_patterns:
      - '^\d{2}\.\d{3}\.\d{4}\.\d{5}$'
  gipuzkoa:
    territory: gipuzkoa
    level: province
    province_codes: ["20"]
    refcat_patterns:
      - '^\d{3}-\d{7}-\d{4}$'
      - '^\d{7}$'
  araba:
    territory: araba
    level: province
    province_codes: ["01"]
    refcat_patterns:
      - '^\d{8}$'
