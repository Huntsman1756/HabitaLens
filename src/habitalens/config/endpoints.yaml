# Configuracion versionada de endpoints de proveedores catastrales (G0-A).
# Verificados en vivo el 2026-09-14. Ver docs/decisions.md y docs/probe-evidence.md.
config_version: 1
verified_on: "2026-09-14"

geocoding:
  cartociudad:
    base: "https://www.cartociudad.es/geocoder/api/geocoder"
    candidates: "https://www.cartociudad.es/geocoder/api/geocoder/candidates"
    find: "https://www.cartociudad.es/geocoder/api/geocoder/find"
    reverse: "https://www.cartociudad.es/geocoder/api/geocoder/reverseGeocode"

providers:
  dgc:
    territory: dgc
    source_version: "INSPIRE WFS 2.0.0 stored queries (GetParcel/GetBuildingByParcel) + ATOM"
    crs: "EPSG:4326"
    wfs:
      parcel: "https://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx"
      building: "https://ovc.catastro.meh.es/INSPIRE/wfsBU.aspx"
      address: "https://ovc.catastro.meh.es/INSPIRE/wfsAD.aspx"
    stored_queries:
      parcel: "GetParcel"
      building: "GetBuildingByParcel"
      building_parts: "GetBuildingPartByParcel"
    dnprc: "https://ovc.catastro.meh.es/OVCServWeb/OVCWcfCallejero/COVCCallejero.svc/rest/Consulta_DNPRC"
    types:
      parcel: "cp:CadastralParcel"
      building: "bu:Building"
      address: "ad:Address"
    atom:
      parcel_index: "https://www.catastro.hacienda.gob.es/INSPIRE/CadastralParcels/ES.SDGC.CP.atom.xml"
      building_index: "https://www.catastro.hacienda.gob.es/INSPIRE/buildings/ES.SDGC.BU.atom.xml"
      address_index: "https://www.catastro.hacienda.gob.es/INSPIRE/Addresses/ES.SDGC.AD.atom.xml"
      hierarchy: province
    filter:
      # Verificado: el WFS de la DGC ignora filtros ad-hoc y devuelve una pagina fija.
      parcel_property: null
      building_property: null
    coverage:
      level: national
      codes: ["ES"]
      description: "Todo el territorio del Estado (excepto Pais Vasco y Navarra en regimen foral)."

  navarra:
    territory: navarra
    source_version: "IDENA GeoServer WFS 2.0.0 (INSPIRE CP + capas CATAST_ locales)"
    crs: "EPSG:4258"
    wfs:
      parcel: "https://idena.navarra.es/ogc/inspire/wfs"
      local: "https://idena.navarra.es/ogc/wfs"
    types:
      parcel: "CP:CadastralParcel"
      building: "IDENA:CATAST_Pol_Edificacion"
      address: "IDENA:CATAST_Txt_Portal"
    filter:
      parcel_property: "nationalCadastralReference"
      building_property: null
    parcel_feature_tokens: ["CadastralParcel"]
    building_feature_tokens: ["Edificacion", "Edificios", "Building"]
    bbox_axis_buildings: "lonlat"
    bbox_crs_style_buildings: "epsg"
    crs_by_kind:
      parcel: "EPSG:4258"
      building: "EPSG:25830"
      address: "EPSG:25830"
    coverage:
      level: region
      codes: ["ES-NC"]
      description: "Comunidad Foral de Navarra."
    notes: "No existe WFS INSPIRE BU/AD ni ATOM INSPIRE; se usan capas CATAST_ locales."

  bizkaia:
    territory: bizkaia
    source_version: "ArcGIS INSPIRE WFS 2.0.0 (Annex1 + Buildings) + ATOM municipal"
    crs: "EPSG:4258"
    wfs:
      parcel: "https://geo.bizkaia.eus/arcgisserverinspire/rest/services/Catastro/Annex1/MapServer/exts/InspireFeatureDownload/service"
      building: "https://geo.bizkaia.eus/arcgisserverinspire/rest/services/Catastro/Buildings/MapServer/exts/InspireFeatureDownload/service"
    types:
      parcel: "cp:CadastralParcel"
      address: "ad:Address"
      building: "bu-core2d:Building"
    atom:
      parcel_index: "https://apli.bizkaia.eus/apps/Danok/INSPIRE/cadastralparcels.xml"
      building_index: "https://apli.bizkaia.eus/apps/Danok/INSPIRE/buildings.xml"
      address_index: "https://apli.bizkaia.eus/apps/Danok/INSPIRE/addresses.xml"
      municipality_zip: "https://apli.bizkaia.eus/apps/Danok/INSPIRE/ES.BFA.CP.{code}.zip"
      building_zip: "https://apli.bizkaia.eus/apps/Danok/INSPIRE/ES.BFA.BU.{code}.zip"
      hierarchy: flat
      municipality_length: 3
    filter:
      # Verificado: ArcGIS InspireFeatureDownload ignora filtros de atributo (CQL y FES).
      parcel_property: null
      building_property: null
    bbox_axis_buildings: "latlon"
    coverage:
      level: province
      codes: ["ES-BI"]
      description: "Territorio Historico de Bizkaia."

  gipuzkoa:
    territory: gipuzkoa
    source_version: "MapServer INSPIRE WFS 2.0.0 (CP/BU/AD) + ATOM"
    crs: "EPSG:4258"
    wfs:
      parcel: "https://b5m.gipuzkoa.eus/inspire/wfs/gipuzkoa_wfs_cp"
      building: "https://b5m.gipuzkoa.eus/inspire/wfs/gipuzkoa_wfs_bu"
      address: "https://b5m.gipuzkoa.eus/inspire/wfs/gipuzkoa_wfs_ad"
    types:
      parcel: "cp:CadastralParcel"
      building: "bu-ext2d:Building"
      address: "ad:Address"
    atom:
      parcel_index: "https://b5m.gipuzkoa.eus/inspire/download/cadastralparcels.xml"
      building_index: "https://b5m.gipuzkoa.eus/inspire/download/buildings.xml"
      address_index: "https://b5m.gipuzkoa.eus/inspire/download/addresses.xml"
      hierarchy: territory
    filter:
      parcel_property: "cp:nationalCadastralReference"
      building_property: null
    bbox_axis_buildings: "lonlat"
    bbox_crs_style_buildings: "epsg"
    coverage:
      level: province
      codes: ["ES-SS"]
      description: "Territorio Historico de Gipuzkoa."

  araba:
    territory: araba
    source_version: "GeoServer INSPIRE WFS 2.0.0 (CP/BU) + ATOM"
    crs: "EPSG:25830"
    wfs:
      parcel: "https://geo.araba.eus/WFS_INSPIRE_CP"
      building: "https://geo.araba.eus/WFS_INSPIRE_BU"
    types:
      parcel: "INSPIRE_CP:CP.CadastralParcel"
      building: "INSPIRE_BU:BU.Building"
    atom:
      parcel_index: "https://geo.araba.eus/atom/CP/CadastralParcels.atom"
      building_index: "https://geo.araba.eus/atom/BU/Buildings.atom"
      hierarchy: territory
    filter:
      parcel_property: "INSPIRE_CP:nationalCadastralReference"
      building_property: null
    coverage:
      level: province
      codes: ["ES-VI"]
      description: "Territorio Historico de Araba/Alava. Sin servicio INSPIRE AD."

# Fuentes oficiales de evidencia espacial (G0-B). Verificadas 2026-09-14.
evidence_sources:
  snczi:
    source_version: "SNCZI GeoServer WFS 2.0.0 (agua), updateSequence 208597, verificado 2026-09-14"
    service: "https://gis.miteco.gob.es/geoserver/agua/wfs"
    layers:
      flood_q100: "agua:Zi_laminas_q100"
      dph_deslindado: "agua:DPH_Deslindado"
    default_crs: "EPSG:4258"
    license_url: "https://www.miteco.gob.es/es/atencion-al-ciudadano/aviso-legal.html"
  eprtr:
    source_version: "EEA Industrial Emissions Portal / E-PRTR punto v16 (2007-2024), verificado 2026-09-14"
    query: "https://air.discomap.eea.europa.eu/arcgis/rest/services/Air/IED_SiteMap/MapServer/0/query"
    layer: "ied_SiteMap"
    default_crs: "EPSG:4326"
    search_radius_deg: 0.05
    license_url: "https://www.eea.europa.eu/en/legal-notice"
  csn_radon:
    source_version: "CSN Mapa del potencial de radon (GDB, Last-Modified 2023-01-20)"
    default_crs: "EPSG:4326"
    usable: false
    unusable_reason: >-
      Sin servicio OGC verificado y sin licencia abierta declarada: la reutilizacion
      depende del aviso legal del CSN y de la Ley 37/2007. No se activa como fuente
      productora hasta que exista licencia declarada y acceso reproducible (regla de
      G0-B: licencia y acceso antes que parsing).

  siu:
    source_version: "SIU MIVAU ArcGIS Servicios_OGC (REST/WFS), verificado 2026-09-14"
    rest_query: "https://mapas.fomento.gob.es/arcgis/rest/services/SIU/Servicios_OGC/MapServer/15/query"
    wfs: "https://mapas.fomento.gob.es/arcgis/services/SIU/Servicios_OGC/MapServer/WFSServer"
    layer: "OGC_Clases_Suelo"
    default_crs: "EPSG:3857"
    coverage_declared: false
    coverage_description: >-
      Cobertura agregada (5.898 municipios integrados, 98,61% de la poblacion); el
      servicio no expone lista por municipio. 0 features NO implica ausencia.
    license_url: "https://www.datos.gob.es/avisolegal"

  ncse02:
    source_version: "IGN Peligrosidad sismica NCSE-02 (WFS geofisica), verificado 2026-09-14"
    service: "https://www.ign.es/wms-inspire/geofisica"
    layer: "HazardArea2002.NCSE-02"
    default_crs: "EPSG:4258"
    coverage_bounds_wgs84: [-19.0, 27.0, 6.0, 46.0]
    coverage_description: "Peninsula Iberica, Illes Balears, Canarias, Ceuta y Melilla (scope Nacional)"
    license_url: "https://www.ign.es/web/ign/portal/politica-datos"

  btn:
    source_version: "IGN/CNIG BTN redes de transporte (WFS), verificado 2026-09-14"
    service: "https://servicios.idee.es/wfs-inspire/transportes"
    layers:
      roads: "tn-ro:RoadLink"
      rail: "tn-ra:RailwayLink"
    default_crs: "EPSG:4258"
    coverage_bounds_wgs84: [-18.152815, 27.638737, 4.311363, 43.788616]
    coverage_description: "Red de transporte de cobertura nacional (BTN)"
    license_url: "https://centrodedescargas.cnig.es/CentroDescargas/politica-datos"

# P1.B: registros autonomicos de CEE. Solo Cataluna es consultable por refcat;
# Madrid y Castilla-La Mancha publican ZIP/XML masivos (adaptadores pendientes).
cee_sources:
  catalunya:
    source_version: "ICAEN CEE Catalunya (Socrata j6ii-t3w2), verificado 2026-09-14"
    resource: "https://analisi.transparenciacatalunya.cat/resource/j6ii-t3w2.json"
    license_url: "https://analisi.transparenciacatalunya.cat/"
